# Standard properties every real Android Studio project generates automatically
# on creation. This project was hand-built from scratch rather than created
# through the IDE's new-project wizard, so this file never got generated —
# that's the actual cause of the "android.useAndroidX" build failure.

# Required: every dependency in this project (Room, CameraX, Material, etc.)
# is an AndroidX library. Without this flag, Gradle refuses to resolve them.
android.useAndroidX=true

# Not needed here — Jetifier exists to auto-convert OLD "android.support.*"
# libraries into AndroidX equivalents. This project has no such legacy
# dependencies, so leaving it off keeps builds faster.
android.enableJetifier=false

# Gives the Gradle daemon enough heap for a comfortable build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Speeds up multi-module builds by running independent modules in parallel.
org.gradle.parallel=true

# Kotlin code style used by Android Studio's default templates.
kotlin.code.style=official
