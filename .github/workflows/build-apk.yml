name: Build shareable APK

# Why this exists: the cloud environment RiseUp was built in has no network
# access to Google's Maven/Gradle servers, so the app can't be compiled there.
# GitHub's own runners have full internet access, so this workflow does the
# build instead — push to main (or run manually) and it produces a debug APK
# attached to a GitHub Release with a public download link, no Play Console
# or Android Studio required just to let friends install and test it.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK with build number
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/RiseUp-debug-${{ github.run_number }}.apk"

      - name: Upload build artifact (requires GitHub login to download)
        uses: actions/upload-artifact@v4
        with:
          name: RiseUp-debug-apk
          path: out/*.apk

      - name: Publish a public Release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "RiseUp test build #${{ github.run_number }}"
          body: |
            Debug build for friend/tester sideloading. Not signed for the Play Store.
            Install steps are in TESTING.md at the repo root.
          files: out/*.apk
